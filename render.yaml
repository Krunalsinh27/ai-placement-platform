services:
  - type: web
    name: placement-management-server
    runtime: node
    rootDir: server
    buildCommand: npm ci
    startCommand: node server.js
    healthCheckPath: /api/health
    plan: free
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: STORAGE_DRIVER
        value: gridfs
      - key: EMAIL_PROVIDER
        value: brevo
      - key: EMAIL_MODE
        value: brevo
      - key: CLIENT_URL
        sync: false
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_SENDER_EMAIL
        sync: false
      - key: BREVO_SENDER_NAME
        value: Placement Portal
      - key: AI_PROVIDER
        value: groq
      - key: AI_API_KEY
        sync: false
      - key: AI_MODEL
        value: llama-3.3-70b-versatile
      - key: AI_MODEL_FAST
        value: llama-3.1-8b-instant
      - key: AI_DAILY_CALL_CAP
        value: 400
      - key: AI_USER_DAILY_PARSE_CAP
        value: 5
      - key: AI_USER_DAILY_ANALYZE_CAP
        value: 10
      - key: AI_USER_DAILY_CHAT_CAP
        value: 30


