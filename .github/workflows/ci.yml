name: CI

on:
  push:
    branches: [main, master, 'fix/**', 'feature/**']
  pull_request:
    branches: [main, master]

jobs:
  test-and-build:
    name: Test Server & Build Client
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd mongosh
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            server/package-lock.json
            client/package-lock.json

      - name: Install server dependencies
        working-directory: ./server
        run: npm ci

      - name: Run server automated tests
        working-directory: ./server
        env:
          TZ: UTC
          NODE_ENV: test
          EMAIL_MODE: console
          JWT_SECRET: supersecret_ci_jwt_key_must_be_over_32_characters_long_for_security
          MONGO_URI_TEST: mongodb://127.0.0.1:27017/placement_management_test
          CLIENT_URL: http://localhost:5173
        run: npm run test:fresh

      - name: Install client dependencies
        working-directory: ./client
        run: npm ci

      - name: Build client production bundle
        working-directory: ./client
        env:
          VITE_API_URL: http://localhost:5000/api
        run: npm run build

